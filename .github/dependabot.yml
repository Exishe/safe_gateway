version: 2
updates:
  # Monthly and grouped: one PR per ecosystem, so updates stay reviewable.
  # Cooldown: never adopt a release younger than 7 days (supply-chain buffer).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
