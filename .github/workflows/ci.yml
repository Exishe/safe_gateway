name: ci

# Every push: one Ubuntu job. No `pull_request` trigger: all PRs come from branches
# in this repo, which `push` already covers (a second trigger ran the job twice;
# ADR 0007). macOS and Windows only on version tags or by
# hand, because private-repo minutes on those runners count 10x and 2x (ADR 0007).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  checks:
    name: checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"

      - name: Install
        run: uv sync --locked

      # NER models are downloaded fresh on every run and checked against the
      # pinned SHA-256, so the `models` tests run in CI too (ADR 0012). Not
      # cached on purpose: a poisoned cache would skip that check (zizmor).
      - name: Pull NER models (verified against pinned SHA-256)
        run: uv run safeguard models pull

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run ty check

      - name: No egress from the engine (hard rule 2)
        run: uv run python -m tools.check_no_egress

      - name: Licenses of shipped dependencies (hard rule 1)
        run: uv run python -m tools.check_licenses

      - name: Tests
        run: uv run pytest

      # The last layer for personal data and keys: local hooks can be skipped,
      # CI cannot.
      - name: Identifier-shaped PII in tracked files
        run: uv run python -m tools.scan_pii --tracked

      - name: Secrets in tracked files
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

      - name: Bandit (medium and above)
        run: uv run bandit -c pyproject.toml -r gateway tools -q -ll

      - name: Dependency CVEs
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt" -q
          uv run pip-audit --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

      - name: Semgrep
        run: >-
          uv run semgrep scan --config p/python --config p/secrets
          --metrics=off --error gateway tools

      - name: Workflow security
        # Offline audits; action SHAs were pinned from the official repos' tags.
        run: uv run zizmor --offline .github/workflows .github/dependabot.yml

  # The web UI (ADR 0024): licenses, lint with typecheck, unit tests, build.
  # No dependency cache on purpose (cache poisoning, zizmor); install scripts are off
  # because nothing in the tree needs them.
  web:
    name: web UI (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: npm ci --ignore-scripts

      - name: Licenses of shipped and direct packages (hard rule 1)
        run: npm run licenses

      - name: Lint and typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  platforms:
    name: tests (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest] # macos-14 is arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"

      - name: Install
        run: uv sync --locked

      # Platform markers differ: the .dmg and .msi ship dependencies Ubuntu never sees.
      - name: Licenses of shipped dependencies on this platform
        run: uv run python -m tools.check_licenses

      - name: Tests
        run: uv run pytest
