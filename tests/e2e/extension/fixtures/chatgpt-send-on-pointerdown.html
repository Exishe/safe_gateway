<!doctype html>
<!-- Fixture: chatgpt.com whose send button sends on pointerdown and clears the box a moment later. -->
<html lang="en">
  <head><meta charset="utf-8" /><style>[contenteditable], textarea { display: block; min-height: 3em; min-width: 20em; border: 1px solid #888; padding: 4px; }</style><title>ChatGPT (fixture)</title></head>
  <body
    data-editor="#prompt-textarea"
    data-send="button[data-testid='send-button']"
    data-user-tag="div"
    data-user-attrs='{"data-message-author-role":"user"}'
    data-bot-tag="div"
    data-bot-attrs='{"data-message-author-role":"assistant"}'
    data-bot-inner="div.markdown.prose"
    data-rerender="true"
    data-send-on="pointerdown"
    data-defer="60"
  >
    <main>
      <div id="thread"></div>
      <form id="composer" onsubmit="return false">
        <div id="prompt-textarea" class="ProseMirror" contenteditable="true" aria-label="Message ChatGPT"><p></p></div>
        <button type="button" data-testid="send-button" aria-label="Send prompt">Send</button>
      </form>
    </main>
    <script src="/__fixture/chat.js"></script>
  </body>
</html>
